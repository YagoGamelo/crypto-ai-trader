name: Tests and syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q app.py market.py model.py paper.py scanner.py asset_analysis.py top5_research.py horizon_research.py brokers.py trading212_demo.py auto_paper.py catalog.py market_monitor.py monitor_panel.py
      - name: Tests
        run: python -m pytest -q
